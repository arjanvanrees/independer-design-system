name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'arjanvanrees/independer-design-system'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version=$(node --print "require('./package.json').version")
          tag_version="${GITHUB_REF_NAME#v}"

          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag v$tag_version does not match package.json version $package_version."
            exit 1
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag must point to a commit on main."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Prepare Nuxt
        run: npm run dev:prepare

      - name: Test
        run: npm run test

      - name: Build and inspect package
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public
